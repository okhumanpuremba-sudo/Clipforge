name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore, Firebase Config, Secrets, and Android SDK
        run: |
          # 1. Restore debug.keystore (matching Firebase OAuth SHA-1 7d129209c5ceb3cff13fc0539724b60798b96623)
          if [ -f "debug.keystore.base64" ]; then
            base64 -di debug.keystore.base64 > debug.keystore
          else
            echo "" | base64 -di > debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Restore app/google-services.json if omitted by GitHub sync
          if [ ! -f "app/google-services.json" ]; then
            echo "" | rev | base64 -di > app/google-services.json
          fi

          # 3. Restore .env required by secrets-gradle-plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 4. Accept Android SDK licenses and ensure compileSdk 36.1 / 36 is installed
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1" || true
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ClipForgeAI.apk
          ls -lh ClipForgeAI.apk

      - name: Upload ClipForge AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForgeAI-APK
          path: ClipForgeAI.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "ClipForge AI Latest Android APK"
          files: ClipForgeAI.apk
          prerelease: false

      - name: Commit APK to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ClipForgeAI.apk
          git diff --staged --quiet || (git commit -m "chore: build ClipForgeAI.apk [skip ci]" && git push)
